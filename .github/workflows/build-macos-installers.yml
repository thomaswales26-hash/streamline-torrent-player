name: Build macOS installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build DMG and PKG
        run: |
          set -o pipefail
          pnpm package:mac:${{ matrix.arch }} 2>&1 | tee packaging-${{ matrix.arch }}.log
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Streamline-packaging-log-${{ matrix.arch }}
          path: packaging-${{ matrix.arch }}.log
          if-no-files-found: ignore

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Streamline-macOS-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.pkg
          if-no-files-found: error
